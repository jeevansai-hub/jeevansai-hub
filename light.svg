<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Majji Jeevan Sai - Developer Profile</title>
  <desc id="desc">Animated developer profile banner with an ASCII portrait, professional details, skills and social links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".52" stop-color="#f3f4f6"/><stop offset="1" stop-color="#e5e7eb"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f9fafb" stop-opacity=".84"/><stop offset="1" stop-color="#f3f4f6" stop-opacity=".94"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"><animate attributeName="stop-color" values="#111827;#374151;#111827" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset=".48" stop-color="#6b7280"><animate attributeName="stop-color" values="#6b7280;#f9fafb;#6b7280" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#374151"><animate attributeName="stop-color" values="#374151;#9ca3af;#374151" dur="8s" repeatCount="indefinite"/></stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.12 0;.12 0;-.12 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#9ca3af" stop-opacity=".13"/><stop offset="1" stop-color="#e5e7eb" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".16"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer></filter>
