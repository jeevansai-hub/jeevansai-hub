    <clipPath id="type6"><rect x="583" y="164" width="0" height="35"><animate attributeName="width" values="0;410;410;0" keyTimes="0;.14;.86;1" dur="18s" begin="15s" repeatCount="indefinite"/></rect></clipPath>
    <style>
