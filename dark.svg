<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Majji Jeevan Sai - Developer Profile</title>
  <desc id="desc">Animated developer profile banner with an ASCII portrait, professional details, skills and social links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".52" stop-color="#111214"/><stop offset="1" stop-color="#030303"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#222428" stop-opacity=".84"/><stop offset="1" stop-color="#0b0c0e" stop-opacity=".94"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"><animate attributeName="stop-color" values="#f8fafc;#8a8f98;#f8fafc" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset=".48" stop-color="#9ca3af"><animate attributeName="stop-color" values="#9ca3af;#ffffff;#9ca3af" dur="8s" repeatCount="indefinite"/></stop>
